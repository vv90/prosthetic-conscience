services:
  gateway:
    image: ghcr.io/${GITHUB_REPOSITORY:-prosthetic-conscience}:latest
    restart: unless-stopped
    environment:
      - PC_AUTH_TOKEN=${PC_AUTH_TOKEN}
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
